# Builds the Overlap iPhone app in Expo's cloud.
# Run it from GitHub: Actions > Build iPhone app > Run workflow.
# Secrets needed (Settings > Secrets and variables > Actions):
#   EXPO_TOKEN    from expo.dev > Account settings > Access tokens
#   ASC_KEY_P8    the full text of the Apple key file AuthKey_V5JXP95HSG.p8
name: Build iPhone app

on:
  workflow_dispatch:
    inputs:
      build:
        description: Build a new version (off = only send the latest finished build to TestFlight)
        type: boolean
        default: true
      submit:
        description: Send to TestFlight
        type: boolean
        default: true
      friends:
        description: Give the newest build to the TestFlight group "Amici"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ios-app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_KEY_ID: V5JXP95HSG
      EXPO_ASC_ISSUER_ID: 4bad4f17-f8fe-4b02-a968-6f35809a69a3
      EXPO_APPLE_TEAM_ID: 93VV2F4VS5
      EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios-app/package-lock.json

      - run: npm ci

      - name: Apple key
        run: |
          printf '%s\n' "${{ secrets.ASC_KEY_P8 }}" > asc.p8
          echo "EXPO_ASC_API_KEY_PATH=$PWD/asc.p8" >> "$GITHUB_ENV"

      - name: Apple signing files
        if: ${{ inputs.build }}
        run: BUNDLE_ID=$(node -p "require('./overlap.json').bundleId") node scripts/apple-signing.mjs

      - name: Build
        if: ${{ inputs.build }}
        run: npx --yes eas-cli@latest build --platform ios --profile production --non-interactive --wait

      - name: Wait for the latest build
        if: ${{ inputs.submit && !inputs.build }}
        run: |
          for i in $(seq 1 90); do
            S=$(npx --yes eas-cli@latest build:list --platform ios --limit 1 --json --non-interactive | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d)[0].status))")
            echo "Latest build: $S"
            case "$S" in FINISHED) exit 0;; ERRORED|CANCELED) exit 1;; esac
            sleep 60
          done
          exit 1

      - name: Send to TestFlight
        if: ${{ inputs.submit }}
        run: npx --yes eas-cli@latest submit --platform ios --profile production --latest --non-interactive

      - name: Give it to the friends group
        if: ${{ inputs.friends }}
        run: node scripts/testflight-group.mjs
