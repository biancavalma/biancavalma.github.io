<title>Overlap database update</title><style>
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#FFF6F9;color:#2A1420;padding:24px 16px}
h1{font-size:22px;margin:0 0 8px}p{font-size:16px;line-height:1.4;margin:0 0 16px}

<h1>Overlap database update</h1>
<p>1. Tap the pink button to copy.<br>2. Open the Supabase editor with the link below.<br>3. Delete what is in the box, paste, press Run.</p>
<button id="b">Copy the update</button>
<a href="https://supabase.com/dashboard/project/ngsvrqecszehmskkunku/sql/new" target="_blank" rel="noopener">Open the Supabase editor &rarr;</a>
<pre id="t"></pre>
<script>
var S="-- Update 12: send notifications to iPhones straight from the database, every minute (no other server needed)\ncreate extension if not exists pg_net with schema extensions;\ncreate extension if not exists pg_cron with schema pg_catalog;\n\ncreate or replace function public.send_pushes() returns void\nlanguage plpgsql security definer set search_path = public as $$\ndeclare ids bigint[]; msgs jsonb;\nbegin\n  -- anything older than a day is no longer news: mark it done without sending\n  update notifications set sent_at = now() where sent_at is null and created_at < now() - interval '1 day';\n  select array_agg(id) into ids from (select id from notifications where sent_at is null order by id limit 30) x;\n  if ids is null then return; end if;\n  select jsonb_agg(jsonb_build_object('to', s.endpoint, 'title', n.title, 'body', n.body, 'sound', 'default',\n           'data', jsonb_build_object('url', n.url)))\n    into msgs\n    from notifications n join push_subscriptions s on s.user_id = n.user_id and s.endpoint like 'ExponentPushToken%'\n   where n.id = any(ids);\n  update notifications set sent_at = now() where id = any(ids);\n  if msgs is not null then\n    perform net.http_post(url := 'https://exp.host/--/api/v2/push/send', body := msgs,\n      headers := '{\"Content-Type\":\"application/json\",\"Accept\":\"application/json\"}'::jsonb);\n  end if;\nend $$;\nrevoke execute on function public.send_pushes() from public, anon, authenticated;\n\n-- replace the old job that waited for a server we never used\nselect cron.unschedule(jobid) from cron.job where jobname = 'overlap-push';\nselect cron.schedule('overlap-push', '* * * * *', 'select public.send_pushes()');\n\nselect 'Update 12 done' as result;\n";
document.getElementById('t').textContent=S;
document.getElementById('b').onclick=function(){var b=this;
 function done(){b.textContent='Copied \u2713 Now open the editor';}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(S).then(done,fallback)}else fallback();
 function fallback(){var r=document.createRange();r.selectNodeContents(document.getElementById('t'));var s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');done()}
};
</script></body></html>
