<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overlap database update</title><style>
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#FFF6F9;color:#2A1420;padding:24px 16px}
h1{font-size:22px;margin:0 0 8px}p{font-size:16px;line-height:1.4;margin:0 0 16px}
button{width:100%;height:60px;border:0;border-radius:999px;background:#FF8FB8;color:#2A1420;font-size:19px;font-weight:800}
a{display:block;text-align:center;margin-top:14px;font-size:17px;font-weight:700;color:#2A1420}
pre{white-space:pre-wrap;font-size:11px;background:#fff;border-radius:14px;padding:12px;margin-top:18px;max-height:40vh;overflow:auto}
</style></head><body>
<h1>Overlap database update</h1>
<p>1. Tap the pink button to copy.<br>2. Open the Supabase editor with the link below.<br>3. Delete what is in the box, paste, press Run.</p>
<button id="b">Copy the update</button>
<a href="https://supabase.com/dashboard/project/ngsvrqecszehmskkunku/sql/new" target="_blank" rel="noopener">Open the Supabase editor &rarr;</a>
<pre id="t"></pre>
<script>
var S="-- Update 7: profile photos. A column for the photo link and a public folder \"avatars\" where each person can only write their own photo.\nalter table public.profiles add column if not exists avatar_url text;\n\ninsert into storage.buckets (id, name, public) values ('avatars', 'avatars', true)\non conflict (id) do update set public = true;\n\ndrop policy if exists \"avatars see own\" on storage.objects;\ndrop policy if exists \"avatars add own\" on storage.objects;\ndrop policy if exists \"avatars change own\" on storage.objects;\ndrop policy if exists \"avatars remove own\" on storage.objects;\ncreate policy \"avatars see own\" on storage.objects for select to authenticated\n  using (bucket_id = 'avatars' and (storage.foldername(name))[1] = auth.uid()::text);\ncreate policy \"avatars add own\" on storage.objects for insert to authenticated\n  with check (bucket_id = 'avatars' and (storage.foldername(name))[1] = auth.uid()::text);\ncreate policy \"avatars change own\" on storage.objects for update to authenticated\n  using (bucket_id = 'avatars' and (storage.foldername(name))[1] = auth.uid()::text)\n  with check (bucket_id = 'avatars' and (storage.foldername(name))[1] = auth.uid()::text);\ncreate policy \"avatars remove own\" on storage.objects for delete to authenticated\n  using (bucket_id = 'avatars' and (storage.foldername(name))[1] = auth.uid()::text);\n";
document.getElementById('t').textContent=S;
document.getElementById('b').onclick=function(){var b=this;
 function done(){b.textContent='Copied \u2713 Now open the editor';}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(S).then(done,fallback)}else fallback();
 function fallback(){var r=document.createRange();r.selectNodeContents(document.getElementById('t'));var s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');done()}
};
</script></body></html>
