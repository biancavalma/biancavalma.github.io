<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overlap database update</title><style>
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#FFF6F9;color:#2A1420;padding:24px 16px}
h1{font-size:22px;margin:0 0 8px}p{font-size:16px;line-height:1.4;margin:0 0 16px}

a{display:block;text-align:center;margin-top:14px;font-size:17px;font-weight:700;color:#2A1420}

<h1>Overlap database update</h1>
<p>1. Tap the pink button to copy.<br>2. Open the Supabase editor with the link below.<br>3. Delete what is in the box, paste, press Run.</p>
<button id="b">Copy the update</button>
<a href="https://supabase.com/dashboard/project/ngsvrqecszehmskkunku/sql/new" target="_blank" rel="noopener">Open the Supabase editor &rarr;</a>
<pre id="t"></pre>
<script>
var S="-- Update 7: profile photos. A column for the photo link and a public folder \"avatars\" where each person can only write their own photo.\nalter table public.profiles add column if not exists avatar_url text;\n\ninsert into storage.buckets (id, name, public) values ('avatars', 'avatars', true)\non conflict (id) do update set public = true;\n\ndrop policy if exists \"avatars see own\" on storage.objects;\ndrop policy if exists \"avatars add own\" on storage.objects;\ndrop policy if exists \"avatars change own\" on storage.objects;\ndrop policy if exists \"avatars remove own\" on storage.objects;\ncreate policy \"avatars see own\" on storage.objects for select to authenticated\n  using (bucket_id = 'avatars' and (storage.foldername(name))[1] = auth.uid()::text);\ncreate policy \"avatars add own\" on storage.objects for insert to authenticated\n  with check (bucket_id = 'avatars' and (storage.foldername(name))[1] = auth.uid()::text);\ncreate policy \"avatars change own\" on storage.objects for update to authenticated\n  using (bucket_id = 'avatars' and (storage.foldername(name))[1] = auth.uid()::text)\n  with check (bucket_id = 'avatars' and (storage.foldername(name))[1] = auth.uid()::text);\ncreate policy \"avatars remove own\" on storage.objects for delete to authenticated\n  using (bucket_id = 'avatars' and (storage.foldername(name))[1] = auth.uid()::text);\n\n-- Update 8: invite friends to one of your trips. They get an alert, and when they tap Join the trip is added to their own calendar.\ncreate table if not exists public.trip_invites (\n  id uuid primary key default gen_random_uuid(),\n  trip_id uuid not null references public.trips(id) on delete cascade,\n  from_user uuid not null references public.profiles(id) on delete cascade,\n  to_user uuid not null references public.profiles(id) on delete cascade,\n  status text not null default 'pending' check (status in ('pending', 'accepted', 'declined')),\n  created_at timestamptz not null default now(),\n  unique (trip_id, to_user)\n);\nalter table public.trip_invites enable row level security;\ndrop policy if exists \"see my trip invites\" on public.trip_invites;\ncreate policy \"see my trip invites\" on public.trip_invites for select using (auth.uid() in (from_user, to_user));\n\n-- send invites for one of my trips, only to friends\ncreate or replace function public.invite_to_trip(t uuid, people uuid[]) returns int\nlanguage plpgsql security definer set search_path = public as $$\ndeclare n int := 0; p uuid; tr trips; nm text; k int;\nbegin\n  select * into tr from trips where id = t and user_id = auth.uid();\n  if not found then raise exception 'not your trip'; end if;\n  select coalesce(nullif(split_part(name, ' ', 1), ''), 'A friend') into nm from profiles where id = auth.uid();\n  foreach p in array coalesce(people, '{}') loop\n    if p <> auth.uid() and is_friend(p) then\n      insert into trip_invites (trip_id, from_user, to_user) values (t, auth.uid(), p) on conflict (trip_id, to_user) do nothing;\n      get diagnostics k = row_count;\n      if k > 0 then\n        n := n + 1;\n        insert into notifications (user_id, title, body, url)\n        values (p, nm || ' invites you to ' || tr.city, 'Open Overlap and tap Join to add it to your calendar.', '/');\n      end if;\n    end if;\n  end loop;\n  return n;\nend;\n$$;\n\n-- invites waiting for me\ncreate or replace function public.my_trip_invites()\nreturns table (id uuid, from_user uuid, from_name text, city text, start_date date, end_date date, emoji text, note text)\nlanguage sql stable security definer set search_path = public as $$\n  select i.id, i.from_user, pr.name, tr.city, tr.start_date, tr.end_date, tr.emoji, tr.note\n  from trip_invites i join trips tr on tr.id = i.trip_id join profiles pr on pr.id = i.from_user\n  where i.to_user = auth.uid() and i.status = 'pending' and tr.end_date >= current_date\n  order by tr.start_date;\n$$;\n\n-- who I invited to my trips, and whether they joined\ncreate or replace function public.my_trip_guests()\nreturns table (trip_id uuid, to_user uuid, status text)\nlanguage sql stable security definer set search_path = public as $$\n  select i.trip_id, i.to_user, i.status from trip_invites i where i.from_user = auth.uid();\n$$;\n\n-- Join or Not now\ncreate or replace function public.answer_trip_invite(i uuid, yes boolean) returns void\nlanguage plpgsql security definer set search_path = public as $$\ndeclare inv trip_invites; tr trips; nm text;\nbegin\n  select * into inv from trip_invites where id = i and to_user = auth.uid() and status = 'pending';\n  if not found then return; end if;\n  update trip_invites set status = case when yes then 'accepted' else 'declined' end where id = i;\n  if yes then\n    select * into tr from trips where id = inv.trip_id;\n    insert into trips (user_id, city, start_date, end_date, emoji, note)\n    values (auth.uid(), tr.city, tr.start_date, tr.end_date, tr.emoji, tr.note);\n    select coalesce(nullif(split_part(name, ' ', 1), ''), 'Your friend') into nm from profiles where id = auth.uid();\n    insert into notifications (user_id, title, body, url)\n    values (inv.from_user, nm || ' joined your ' || tr.city || ' trip', 'You will see it on both calendars.', '/');\n  end if;\nend;\n$$;\ngrant execute on function public.invite_to_trip(uuid, uuid[]) to authenticated;\ngrant execute on function public.my_trip_invites() to authenticated;\ngrant execute on function public.my_trip_guests() to authenticated;\ngrant execute on function public.answer_trip_invite(uuid, boolean) to authenticated;\n\n-- Update 9: ready for the App Store. Block and report people, and a test account for Apple's reviewers.\n\n-- blocking: no friendship, no requests, no invites between the two people\ncreate table if not exists public.blocks (\n  blocker uuid not null references public.profiles(id) on delete cascade,\n  blocked uuid not null references public.profiles(id) on delete cascade,\n  created_at timestamptz not null default now(),\n  primary key (blocker, blocked)\n);\nalter table public.blocks enable row level security;\ndrop policy if exists \"see my blocks\" on public.blocks;\ncreate policy \"see my blocks\" on public.blocks for select using (auth.uid() = blocker);\n\ncreate table if not exists public.reports (\n  id uuid primary key default gen_random_uuid(),\n  reporter uuid references public.profiles(id) on delete set null,\n  reported uuid references public.profiles(id) on delete set null,\n  reason text check (char_length(reason) <= 500),\n  created_at timestamptz not null default now()\n);\nalter table public.reports enable row level security;\n\ncreate or replace function public.is_blocked(a uuid, b uuid) returns boolean\nlanguage sql stable security definer set search_path = public as $$\n  select exists (select 1 from blocks where (blocker = a and blocked = b) or (blocker = b and blocked = a));\n$$;\n\ncreate or replace function public.block_user(other uuid) returns void\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n  if auth.uid() is null or other is null or other = auth.uid() then raise exception 'invalid'; end if;\n  insert into blocks (blocker, blocked) values (auth.uid(), other) on conflict do nothing;\n  delete from friendships where user_a = least(auth.uid(), other) and user_b = greatest(auth.uid(), other);\n  delete from friend_requests where (from_user = other and to_email = (select lower(email) from auth.users where id = auth.uid()))\n    or (from_user = auth.uid() and to_email = (select lower(email) from auth.users where id = other));\n  delete from trip_invites where (from_user = other and to_user = auth.uid()) or (from_user = auth.uid() and to_user = other);\nend;\n$$;\n\n-- a report also blocks, and tells the person who runs Overlap\ncreate or replace function public.report_user(other uuid, why text) returns void\nlanguage plpgsql security definer set search_path = public as $$\ndeclare admin uuid;\nbegin\n  if auth.uid() is null or other is null or other = auth.uid() then raise exception 'invalid'; end if;\n  insert into reports (reporter, reported, reason) values (auth.uid(), other, left(coalesce(why, ''), 500));\n  perform block_user(other);\n  select id into admin from auth.users where lower(email) = 'bianca.valmarana@gmail.com';\n  if admin is not null then\n    insert into notifications (user_id, title, body, url) values (admin, 'Overlap: someone was reported', 'Open Supabase, table reports, to see it.', '/');\n  end if;\nend;\n$$;\ngrant execute on function public.block_user(uuid) to authenticated;\ngrant execute on function public.report_user(uuid, text) to authenticated;\n\n-- blocked people cannot send requests or become friends again\ncreate or replace function public.stop_blocked_request() returns trigger\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n  if exists (select 1 from auth.users u where lower(u.email) = new.to_email and is_blocked(new.from_user, u.id)) then return null; end if;\n  return new;\nend;\n$$;\ndrop trigger if exists friend_request_blocked on public.friend_requests;\ncreate trigger friend_request_blocked before insert on public.friend_requests for each row execute function public.stop_blocked_request();\n\ncreate or replace function public.stop_blocked_friendship() returns trigger\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n  if is_blocked(new.user_a, new.user_b) then return null; end if;\n  return new;\nend;\n$$;\ndrop trigger if exists friendship_blocked on public.friendships;\ncreate trigger friendship_blocked before insert on public.friendships for each row execute function public.stop_blocked_friendship();\n\n-- test account for Apple's reviewers (signs in with a password, no email code), with one friend and a few trips\ndo $$\ndeclare rid uuid := '0f0e0d0c-0b0a-4000-8000-000000000001'; fid uuid := '0f0e0d0c-0b0a-4000-8000-000000000002'; u record;\nbegin\n  for u in select * from (values (rid, 'review.overlap@example.com', '$2a$10$2dZPv/ROwguVpxOoX2CNtuwQ2KkAm/JWu8sVb11q6yWJm2T/AeXOu'), (fid, 'sam.overlap@example.com', '$2a$10$abcdefghijklmnopqrstuuJ0F1nT7vZ3WkWnq0b8l0aZbEo8m6q2W')) as t(id, email, pw) loop\n    insert into auth.users (instance_id, id, aud, role, email, encrypted_password, email_confirmed_at, raw_app_meta_data, raw_user_meta_data, created_at, updated_at, confirmation_token, email_change, email_change_token_new, recovery_token)\n    values ('00000000-0000-0000-0000-000000000000', u.id, 'authenticated', 'authenticated', u.email, u.pw, now(), '{\"provider\":\"email\",\"providers\":[\"email\"]}', '{}', now(), now(), '', '', '', '')\n    on conflict (id) do update set encrypted_password = excluded.encrypted_password;\n    insert into auth.identities (id, user_id, provider_id, identity_data, provider, last_sign_in_at, created_at, updated_at)\n    values (gen_random_uuid(), u.id, u.id::text, jsonb_build_object('sub', u.id::text, 'email', u.email, 'email_verified', true), 'email', now(), now(), now())\n    on conflict do nothing;\n  end loop;\n  insert into profiles (id) values (rid), (fid) on conflict do nothing;\n  update profiles set name = 'Alex Review', home = 'Florence' where id = rid;\n  update profiles set name = 'Sam Example', home = 'London' where id = fid;\n  begin\n    update profiles set username = 'alex_review', phone = '+39 333 000 0001' where id = rid;\n    update profiles set username = 'sam_example', phone = '+44 7700 900001' where id = fid;\n  exception when others then null;\n  end;\n  insert into friendships (user_a, user_b) values (least(rid, fid), greatest(rid, fid)) on conflict do nothing;\n  delete from trips where user_id in (rid, fid);\n  insert into trips (user_id, city, start_date, end_date) values\n    (rid, 'Paris', current_date + 10, current_date + 14),\n    (rid, 'London', current_date + 30, current_date + 33),\n    (fid, 'Florence', current_date + 3, current_date + 6),\n    (fid, 'Paris', current_date + 12, current_date + 16);\nend;\n$$;\n";
document.getElementById('t').textContent=S;
document.getElementById('b').onclick=function(){var b=this;
 function done(){b.textContent='Copied \u2713 Now open the editor';}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(S).then(done,fallback)}else fallback();
 function fallback(){var r=document.createRange();r.selectNodeContents(document.getElementById('t'));var s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');done()}
};
</script></body></html>
