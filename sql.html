<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overlap database update</title><style>
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#FFF6F9;color:#2A1420;padding:24px 16px}
h1{font-size:22px;margin:0 0 8px}p{font-size:16px;line-height:1.4;margin:0 0 16px}
button{width:100%;height:60px;border:0;border-radius:999px;background:#FF8FB8;color:#2A1420;font-size:19px;font-weight:800}
a{display:block;text-align:center;margin-top:14px;font-size:17px;font-weight:700;color:#2A1420}
pre{white-space:pre-wrap;font-size:11px;background:#fff;border-radius:14px;padding:12px;margin-top:18px;max-height:40vh;overflow:auto}
</style></head><body>
<h1>Overlap database update</h1>
<p>1. Tap the pink button to copy.<br>2. Open the Supabase editor with the link below.<br>3. Delete what is in the box, paste, press Run.</p>
<button id="b">Copy the update</button>
<a href="https://supabase.com/dashboard/project/ngsvrqecszehmskkunku/sql/new" target="_blank" rel="noopener">Open the Supabase editor &rarr;</a>
<pre id="t"></pre>
<script>
var S="-- Update 6: a phone alert when someone asks to share plans with you, and when they accept.\n\ncreate or replace function public.notify_request() returns trigger\nlanguage plpgsql security definer set search_path = public as $$\ndeclare who uuid; nm text;\nbegin\n  select id into who from auth.users where lower(email) = lower(new.to_email) limit 1;\n  if who is null then return new; end if;\n  select coalesce(nullif(split_part(name, ' ', 1), ''), 'A friend') into nm from profiles where id = new.from_user;\n  insert into notifications(user_id, title, body, url)\n  values (who, nm || ' wants to share plans', 'Open Overlap and tap Accept to see each other''s trips.', '/');\n  return new;\nend;\n$$;\ndrop trigger if exists friend_request_alert on public.friend_requests;\ncreate trigger friend_request_alert after insert on public.friend_requests\n  for each row execute function public.notify_request();\n\ncreate or replace function public.notify_friends() returns trigger\nlanguage plpgsql security definer set search_path = public as $$\ndeclare other uuid; nm text;\nbegin\n  -- tell the person who did not just accept\n  other := case when new.user_a = auth.uid() then new.user_b else new.user_a end;\n  if auth.uid() is null or other = auth.uid() then return new; end if;\n  select coalesce(nullif(split_part(name, ' ', 1), ''), 'Your friend') into nm from profiles where id = auth.uid();\n  insert into notifications(user_id, title, body, url)\n  values (other, nm || ' accepted', 'You now see each other''s trips on Overlap.', '/');\n  return new;\nend;\n$$;\ndrop trigger if exists friendship_alert on public.friendships;\ncreate trigger friendship_alert after insert on public.friendships\n  for each row execute function public.notify_friends();\n";
document.getElementById('t').textContent=S;
document.getElementById('b').onclick=function(){var b=this;
 function done(){b.textContent='Copied \u2713 Now open the editor';}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(S).then(done,fallback)}else fallback();
 function fallback(){var r=document.createRange();r.selectNodeContents(document.getElementById('t'));var s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');done()}
};
</script></body></html>
